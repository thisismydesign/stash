name: CI

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  # A preview build of this commit against a local stack with its own
  # migrations and seed, so schema changes are tested before they deploy.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      # GHCR is next to the runners; the default registry, ECR Public, rate-limits shared runner IPs into minutes of retries.
      # GHCR throttles them too, now and then, mid-pull; images pulled before that stay cached, so a retry finishes the rest.
      # The stack starts while the packages install; its output follows the install's.
      - run: |
          (
            for attempt in 1 2 3; do
              supabase start -x studio,imgproxy,postgres-meta,logflare,vector,supavisor,mailpit && exit 0
              [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
            done
            exit 1
          ) > "$RUNNER_TEMP/stack.log" 2>&1 &
          stack=$!
          pnpm install --frozen-lockfile || failed=1
          wait "$stack" || failed=1
          cat "$RUNNER_TEMP/stack.log"
          [ -z "$failed" ]
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      - run: pnpm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: test-results/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, e2e]
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: pnpm install --frozen-lockfile
      # The Supabase VM is reachable on the tailnet only; see docs/deploy.md.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - run: |
          install -m 600 /dev/null "$RUNNER_TEMP/stash-ci"
          printf '%s\n' "$STASH_VM_SSH_KEY" > "$RUNNER_TEMP/stash-ci"
          echo "STASH_VM_SSH_KEY_FILE=$RUNNER_TEMP/stash-ci" >> "$GITHUB_ENV"
        env:
          STASH_VM_SSH_KEY: ${{ secrets.STASH_VM_SSH_KEY }}
      - run: pnpm run supabase:deploy
      - run: pnpm run deploy

  # The deployed site itself, with the same specs.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.PRODUCTION_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      STASH_TEST_EMAIL: ${{ vars.STASH_TEST_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-traces
          path: test-results/
