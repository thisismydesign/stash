name: CI

on: push

env:
  SUPABASE_CLI: 2.122.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  # A preview build of this commit against a local stack with its own
  # migrations and seed, so schema changes are tested before they deploy.
  e2e:
    runs-on: ubuntu-latest
    env:
      SUPABASE_EXCLUDED: studio,imgproxy,postgres-meta,logflare,vector,supavisor,mailpit
      # GHCR is next to the runners; the default registry, ECR Public, rate-limits shared runner IPs into minutes of retries.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI }}
      # The stack's images are kept from run to run: pulled once, saved after a green job, loaded before the next.
      - uses: AndreKurait/docker-cache@e1eb0120c0c16b3f1c6ff1c0ef4ebc9f67f8dc6a # 0.7.1
        with:
          key: supabase-images-${{ env.SUPABASE_CLI }}-${{ env.SUPABASE_INTERNAL_IMAGE_REGISTRY }}-${{ hashFiles('supabase/config.toml') }}
      # GHCR throttles pulls too, now and then, mid-pull; images pulled before that stay, so a retry finishes the rest.
      - run: |
          for attempt in 1 2 3; do
            supabase start -x "$SUPABASE_EXCLUDED" && exit 0
            [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
          done
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e
      # Traces are kept for failed attempts, including those a retry made good.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          overwrite: true
          name: e2e-traces
          path: |
            test-results/
            !test-results/.last-run.json
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, e2e]
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI }}
      - run: pnpm install --frozen-lockfile
      # The Supabase VM is reachable on the tailnet only; see docs/deploy.md.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - run: |
          install -m 600 /dev/null "$RUNNER_TEMP/stash-ci"
          printf '%s\n' "$STASH_VM_SSH_KEY" > "$RUNNER_TEMP/stash-ci"
          echo "STASH_VM_SSH_KEY_FILE=$RUNNER_TEMP/stash-ci" >> "$GITHUB_ENV"
        env:
          STASH_VM_SSH_KEY: ${{ secrets.STASH_VM_SSH_KEY }}
      - run: pnpm run supabase:deploy
      - run: pnpm run deploy

  # The deployed site itself, with the same specs.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.PRODUCTION_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      STASH_TEST_EMAIL: ${{ vars.STASH_TEST_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e
      # Traces are kept for failed attempts, including those a retry made good.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          overwrite: true
          name: smoke-traces
          path: |
            test-results/
            !test-results/.last-run.json
          if-no-files-found: ignore
